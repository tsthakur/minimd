input_file: Ar_fcc.xyz
output_file: Ar_fcc

ensemble: nvt
temperature: 1.2
tau: 10.0

dt: 0.001
n_steps: 1000
log_every: 1000
traj_every: 1000

r_cut: 1.5
r_skin: 0.3

sigma: 0.9
epsilon: 0.6

seed: 42

box: [3.764144, 3.764144, 3.764144]
supercell: [4, 4, 4]

backend: cpp_mpi # available options python, numpy, torch, fortran, cpp, cpp_openmp, cpp_mpi
threads: 8